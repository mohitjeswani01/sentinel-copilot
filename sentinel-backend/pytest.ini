[pytest]
# Run from sentinel-backend/:  pytest
testpaths = tests

# Make the `app` package importable without installing it.
pythonpath = .

addopts =
    -q
    --strict-markers
    --strict-config

# conftest.py, test_trust_vectors.py, test_scorer.py and test_api_routes.py are
# pure-unit: no Docker socket, no SigNoz, no network.
#
# The older files are not all hermetic — test_api_and_mcp.py deliberately dials
# an unresolvable host to prove the MCP client raises MCPClientError, so a
# no-DNS environment can make it slow or flaky.
